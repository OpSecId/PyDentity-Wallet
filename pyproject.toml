[project]
name = "pydentity-wallet"
version = "0.1.0"
description = "Mobile wallet interface for ACApy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aries-askar>=0.5.0",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-qrcode>=3.2.0",
    "flask-session>=0.8.0",
    "ngrok==1.4.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "redis>=8.0.0",
    "requests>=2.34.0",
    "webauthn>=2.8.0",
    "watchdog>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]
